<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSM Iso Buildings</title>
    <link rel="icon" href="data:,">
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="map-border-note">— граница РФ/Украины (схематично, не для навигации)</div>
      <div id="scene-container" class="hidden"></div>

      <div id="hud">
        <div id="hud-title">
          <span class="hud-mark">◆</span>
          <span>OSM ISO</span>
        </div>

        <div id="hud-status">
          <span id="status-text">Наведите карту на нужный участок</span>
        </div>

        <div id="hud-controls">
          <button id="btn-render" type="button">Построить 3D</button>
          <button id="btn-back" type="button" class="hidden">← К карте</button>
        </div>

        <div id="hud-legend" class="hidden">
          <div class="legend-row"><span class="swatch swatch-exact"></span>height из OSM</div>
          <div class="legend-row"><span class="swatch swatch-levels"></span>по этажам</div>
          <div class="legend-row"><span class="swatch swatch-guess"></span>оценка</div>
        </div>
      </div>

      <div id="risk-panel" class="hidden">
        <button id="risk-close" type="button" class="risk-close" aria-label="Закрыть">×</button>
        <h2 id="risk-title">Оценка риска</h2>
        <div class="risk-disclaimer" id="risk-disclaimer-top"></div>

        <label class="risk-field">
          Этаж, на котором вы находитесь
          <input type="number" id="risk-floor" value="1" min="1" max="40" />
          <span class="risk-hint" id="risk-floor-hint"></span>
        </label>

        <label class="risk-field">
          Куда смотрят окна (сторона дома)
          <select id="risk-facade">
            <option value="-1" selected>Не указано / несколько сторон</option>
            <option value="0">Север</option>
            <option value="45">Северо-восток</option>
            <option value="90">Восток</option>
            <option value="135">Юго-восток</option>
            <option value="180">Юг</option>
            <option value="225">Юго-запад</option>
            <option value="270">Запад</option>
            <option value="315">Северо-запад</option>
          </select>
        </label>

        <button id="risk-calc" type="button">Рассчитать</button>
        <div class="risk-status" id="risk-status"></div>

        <div id="risk-result" class="hidden">
          <div class="risk-score" id="risk-score"></div>
          <div id="risk-rows"></div>
          <div class="risk-disclaimer" id="risk-disclaimer-bottom"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
